<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firebase Realtime Database Starter</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --danger: #ef4444;
      --border: #334155;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 1.5rem;
      margin-top: 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    #statusBadge {
      font-size: 0.85rem;
      padding: 0.5rem 0.75rem;
      border-radius: 20px;
      margin-bottom: 1rem;
      display: inline-block;
    }

    .status-online {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .status-warning {
      background: rgba(234, 179, 8, 0.15);
      color: #facc15;
      border: 1px solid rgba(234, 179, 8, 0.3);
    }

    form {
      display: flex;
      gap: 0.5rem;
    }

    input[type="text"] {
      flex: 1;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--primary);
    }

    button {
      cursor: pointer;
      background: var(--primary);
      color: #0f172a;
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background 0.2s;
    }

    button:hover {
      background: var(--primary-hover);
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .item-card {
      background: #0f172a;
      border: 1px solid var(--border);
      padding: 0.85rem 1rem;
      border-radius: 8px;
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-info {
      display: flex;
      flex-direction: column;
    }

    .item-title {
      font-weight: 500;
      color: var(--text);
    }

    .item-time {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .item-actions {
      display: flex;
      gap: 0.4rem;
    }

    .btn-edit {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.35rem 0.65rem;
      font-size: 0.8rem;
    }

    .btn-edit:hover {
      background: var(--border);
      color: var(--text);
    }

    .btn-delete {
      background: transparent;
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: var(--danger);
      padding: 0.35rem 0.65rem;
      font-size: 0.8rem;
    }

    .btn-delete:hover {
      background: var(--danger);
      color: white;
    }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 2rem 0;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>🔥 Firebase Realtime DB Starter</h1>
      <div id="statusBadge">Checking connection...</div>

      <form id="itemForm">
        <input type="text" id="itemInput" placeholder="Enter message or note..." required>
        <button type="submit">Add Item</button>
      </form>
    </div>

    <div class="card">
      <h2 style="font-size: 1.1rem; margin-top: 0;">Live Data Stream</h2>
      <ul id="itemsList">
        <li class="empty-state">Loading data from Firebase...</li>
      </ul>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
